<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dave Gulli — Resume</title>
  <meta name="description" content="Printable resume of Dave Gulli, Forward Deployed Engineer and AI Architect at Google Cloud.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Printable resume. Content comes from js/data.js. */
    @page { size: A4; margin: 11mm 13mm; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f0f0ec; color: #15191a; font: 400 9.3pt/1.42 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .bar { max-width: 210mm; margin: 0 auto; padding: 16px 4px; display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
    .bar a, .bar button { color: #0f766e; font: 500 15px "Inter", sans-serif; background: none; border: 0; cursor: pointer; text-decoration: none; padding: 6px 0; }
    .page { max-width: 210mm; margin: 0 auto 40px; background: #fff; padding: 15mm; box-shadow: 0 10px 40px -20px rgba(0,0,0,.25); }
    h1, h2, h3 { font-family: "Space Grotesk", sans-serif; margin: 0; letter-spacing: -.01em; }
    h1 { font-size: 21pt; line-height: 1.1; }
    .title { font-weight: 600; margin-top: 4px; color: #0f766e; }
    .meta { margin-top: 5px; color: #4d5557; font-size: 8.8pt; }
    .meta a { color: inherit; text-decoration: none; }
    h2 { font-size: 11pt; text-transform: uppercase; letter-spacing: .1em; color: #0f766e; border-bottom: 1px solid #dfe1dc; padding-bottom: 3px; margin: 11px 0 6px; break-after: avoid; }
    h3 { font-size: 11pt; margin-top: 8px; break-after: avoid; }
    p { margin: 0; }
    ul { margin: 4px 0 0; padding-left: 16px; }
    li { margin-bottom: 1.5px; }
    .role { display: flex; justify-content: space-between; gap: 14px; margin-top: 5px; font-weight: 600; break-after: avoid; }
    .role span:last-child { font-weight: 400; color: #4d5557; text-align: right; font-size: 8.8pt; flex: none; max-width: 48%; }
    .skills li, .creds li { margin-bottom: 2px; }
    @media print { body { background: #fff; } .bar { display: none; } .page { box-shadow: none; padding: 0; margin: 0; max-width: none; } }
    @media (max-width: 640px) { .page { padding: 22px; } .role { flex-direction: column; gap: 0; } .role span:last-child { text-align: left; max-width: none; } }
  </style>
</head>
<body>
  <div class="bar"><a href="./">← Back to site</a><button type="button" onclick="print()">Print / save as PDF</button></div>
  <main class="page" id="page"></main>
  <script src="js/data.js"></script>
  <script>
    (function () {
      var R = window.RESUME;
      var li = function (b) { return "<li>" + (b.lead ? "<b>" + b.lead + ":</b> " : "") + b.text + "</li>"; };
      document.getElementById("page").innerHTML =
        "<h1>" + R.name + '</h1><p class="title">' + R.title + "</p>" +
        '<p class="meta">' + R.location + ' | <a href="mailto:' + R.email + '">' + R.email + "</a> | " + '<a href="' + R.linkedin + '">' + R.linkedinLabel + "</a></p>" +
        "<h2>Summary</h2><p>" + R.summary + "</p>" +
        '<h2>Skills</h2><ul class="skills">' + R.skills.map(function (s) { return "<li><b>" + s.group + ":</b> " + s.items.join(", ") + "</li>"; }).join("") + "</ul>" +
        "<h2>Experience</h2>" + R.experience.map(function (c) {
          return "<h3>" + c.company + "</h3>" + c.roles.map(function (r) {
            return [{ title: r.title, period: r.period }].concat(r.extraTitles || []).map(function (t) {
              return '<div class="role"><span>' + t.title + "</span><span>" + t.period + "</span></div>";
            }).join("") + "<ul>" + r.bullets.map(li).join("") + "</ul>";
          }).join("");
        }).join("") +
        '<h2>Certifications, education and clearance</h2><ul class="creds">' +
          R.certifications.map(function (g) { return "<li><b>" + g.issuer + ":</b> " + g.items.join(", ") + "</li>"; }).join("") +
          R.education.map(function (e) { return "<li><b>Education:</b> " + e.degree + ", " + e.school + " (" + e.period + ")</li>"; }).join("") +
          "<li><b>Clearance:</b> " + R.clearance.level + "</li></ul>";
    })();
  </script>
</body>
</html>
